<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#nestGrad)" />
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer stylized hexagon nest -->
    <path d="M 256 96 L 396 176 L 396 336 L 256 416 L 116 336 L 116 176 Z" stroke="url(#accentGrad)" stroke-width="24" opacity="0.95" />
    <!-- Center tools crossing: Wrench & Lightning Bolt -->
    <path d="M 256 180 L 220 256 L 292 256 L 256 332" stroke="#ffffff" stroke-width="32" />
    <circle cx="256" cy="140" r="14" fill="#ffffff" stroke="none" />
    <circle cx="360" cy="200" r="12" fill="#38bdf8" stroke="none" />
    <circle cx="152" cy="200" r="12" fill="#38bdf8" stroke="none" />
    <circle cx="360" cy="312" r="12" fill="#38bdf8" stroke="none" />
    <circle cx="152" cy="312" r="12" fill="#38bdf8" stroke="none" />
  </g>
</svg>
